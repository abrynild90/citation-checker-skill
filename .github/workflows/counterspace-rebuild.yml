name: Rebuild Counterspace repair branch
on:
  push:
    branches: ['fix/counterspace-reliability']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: counterspace/tools
      - run: npx playwright install --with-deps chromium
        working-directory: counterspace/tools
      - run: python3 tools/build_page.py
        working-directory: counterspace
      - run: npm test
        working-directory: counterspace/tools
      - name: Commit rebuilt page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add counterspace/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild self-contained Counterspace page from repaired source'
            git push
          fi
