name: Counterspace website
on:
  push:
    paths: ['counterspace/**', '.github/workflows/counterspace.yml']
  pull_request:
    paths: ['counterspace/**', '.github/workflows/counterspace.yml']
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: counterspace/tools/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: counterspace/tools
      - run: npx playwright install --with-deps chromium
        working-directory: counterspace/tools
      - run: python3 tools/build_data.py
        working-directory: counterspace
      - run: npm run build
        working-directory: counterspace/tools
      - run: npm test
        working-directory: counterspace/tools
      - run: node tools/copy_lint.mjs
        working-directory: counterspace
