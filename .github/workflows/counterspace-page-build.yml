name: Build reviewed Counterspace page
on:
  push:
    branches: [improve/counterspace-reader-mobile-scenes]
    paths: ['counterspace/src/**', 'counterspace/tools/**', '.github/workflows/counterspace-page-build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
        working-directory: counterspace/tools
      - run: npm run build
        working-directory: counterspace/tools
      - name: Commit generated page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add counterspace/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Build Counterspace from reviewed source'
            git push
          fi
