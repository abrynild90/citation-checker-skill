name: Build graphics review page
on:
  push:
    branches: ['improve/counterspace-explanatory-graphics']
    paths: ['counterspace/src/**', '.github/workflows/counterspace-build-review.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: improve/counterspace-explanatory-graphics
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: counterspace/tools
      - run: python3 tools/build_page.py
        working-directory: counterspace
      - name: Commit the generated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add counterspace/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Build the reviewed Counterspace graphics"
            git push origin HEAD:improve/counterspace-explanatory-graphics
          fi
