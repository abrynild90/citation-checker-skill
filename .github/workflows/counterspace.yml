name: Counterspace website
on:
  push:
    paths: ['counterspace/**', '.github/workflows/counterspace.yml']
  pull_request:
    paths: ['counterspace/**', '.github/workflows/counterspace.yml']
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: counterspace/tools/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: counterspace/tools
      - run: npx playwright install --with-deps chromium
        working-directory: counterspace/tools
      - run: python3 tools/build_data.py
        working-directory: counterspace
      - run: npm run build
        working-directory: counterspace/tools
      - name: Verify the committed page matches its source
        run: git diff --exit-code -- counterspace/index.html
      - run: npm test
        working-directory: counterspace/tools
      - run: node tools/copy_lint.mjs
        working-directory: counterspace

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: counterspace/tools/package-lock.json
      - run: npm ci
        working-directory: counterspace/tools
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: counterspace/tools
      - run: npm run build
        working-directory: counterspace/tools
      - run: node tools/mobile_check.mjs
        working-directory: counterspace
        env:
          BROWSER: ${{ matrix.browser }}
          OUT: mobile-evidence
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mobile-${{ matrix.browser }}
          path: counterspace/mobile-evidence
