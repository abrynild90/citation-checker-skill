<div class="overlay" id="overlay" aria-hidden="true">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sceneTitle">
    <header>
      <div class="hd"><h2 id="sceneTitle">Scene</h2></div>
      <div class="nav">
        <button class="btn small" id="scPrev" type="button" aria-label="Previous scene">◀<span class="lbl"> Previous</span></button>
        <span class="count" id="sceneDate" aria-label="Scene number"></span>
        <button class="btn small" id="scNext" type="button" aria-label="Next scene"><span class="lbl">Next </span>▶</button>
        <button class="btn small" id="scClose" type="button" aria-label="Close scene">✕<span class="lbl"> Close</span></button>
      </div>
    </header>
    <div class="view" id="sceneView" role="group" aria-label="Scene visual (illustrative)" aria-describedby="sceneCaption sceneSteps"><div
      class="illus">Illustrative<span class="hide-phone">, not orbit-propagated</span> · compressed radial scale</div></div>
    <aside>
      <div class="aside-wrap" id="asideWrap">
      <div class="aside-body" id="asideBody" tabindex="0" role="region" aria-label="Scene description">
        <p id="sceneCaption"></p>
        <details class="steps" id="sceneStepsBox"><summary>What happens in this scene</summary>
          <ol id="sceneSteps"></ol></details>
        <details class="scalenote"><summary>Scale and imagery note</summary><p class="src" id="sceneScale"></p></details>
      </div>
      <div class="scroll-cue" id="scrollCue" aria-hidden="true"><span id="cueTxt">▾ Scroll for more</span><span class="cue-track"><i
        id="scrollProg"></i></span></div>
      <p class="src pin-src" id="sceneSrc"></p>
      </div>
      <div class="aside-law" id="asideLaw"><button class="btn small" id="scRelated" type="button">⚖ Related law</button></div>
    </aside>
    <div class="ctrl">
      <button class="btn small" id="scPlay" type="button" aria-label="Pause">❚❚<span class="lbl"> Pause</span></button>
      <label class="sr" for="scScrub">Scene time</label>
      <input type="range" id="scScrub" min="0" max="1000" value="0">
      <span class="tm" id="scTime" aria-hidden="true"></span>
      <span class="static-note" id="scStatic" hidden>Static diagram: no timeline (reduced motion or no WebGL).</span>
      <span id="scCams" style="display:flex;gap:6px"></span>
      <span class="static-note" id="scStatus" role="status" aria-live="polite"></span>
      <button class="btn small" id="scExport" type="button" aria-label="Export still image (PNG)">⤓<span class="lbl"> Export still (PNG)</span><span
        class="lbl-s"> PNG</span></button>
    </div>
  </div>
</div>
