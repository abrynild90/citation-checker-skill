name: Build Counterspace copy review
on:
  push:
    branches: ['improve/counterspace-copy']
    paths: ['counterspace/src/**', 'counterspace/tools/**', '.github/workflows/counterspace-review-build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: counterspace/tools/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: counterspace/tools
      - run: npx playwright install --with-deps chromium
        working-directory: counterspace/tools
      - run: npm run build
        working-directory: counterspace/tools
      - run: npm test
        working-directory: counterspace/tools
      - name: Commit the verified generated page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add counterspace/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build Counterspace plain-language page'
          git push
