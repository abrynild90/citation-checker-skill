name: Rebuild Counterspace design revision
on:
  push:
    branches: [improve/counterspace-design]
    paths:
      - 'counterspace/src/**'
      - 'counterspace/tools/regression.mjs'
      - '.github/workflows/counterspace-design-build.yml'
permissions:
  contents: write
jobs:
  rebuild:
    if: github.ref == 'refs/heads/improve/counterspace-design'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: counterspace/tools/package-lock.json
      - run: npm ci
        working-directory: counterspace/tools
      - run: npx playwright install --with-deps chromium
        working-directory: counterspace/tools
      - run: python3 tools/build_page.py
        working-directory: counterspace
      - run: npm test
        working-directory: counterspace/tools
      - name: Commit verified generated page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add counterspace/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild verified Counterspace design revision'
            git push origin HEAD:improve/counterspace-design
          fi
